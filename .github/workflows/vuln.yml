# Scheduled vulnerability scan. ci.yml already runs govulncheck on every push,
# but a repo nobody commits to never re-scans — and an advisory published against
# a dependency does not wait for a commit. shard-common is the widest blast
# radius in the fleet: every data-plane and business binary imports it, so a
# vulnerable dependency here reaches all of them.
name: Vuln scan

on:
  schedule:
    # Tuesdays 03:30 UTC — ahead of the consumers (04:00+) so a finding here is
    # visible before the repos that vendor it report.
    - cron: "30 3 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"

      - name: govulncheck
        # PINNED: govulncheck >=v1.2 panics on Go 1.26 ("ForEachElement called on
        # type containing *types.TypeParam") on some code shapes. On a scheduled
        # run nobody is watching, so a tooling crash reads as "that job is always
        # red" and the scan silently stops being a scan. The vulnerability
        # DATABASE is fetched at run time, so the pin costs no detection freshness.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
