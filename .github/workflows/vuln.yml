# Scheduled vulnerability scan. ci.yml already runs govulncheck on every push,
# but a repo nobody commits to never re-scans — and an advisory published against
# a dependency does not wait for a commit. shard-common is the widest blast
# radius in the fleet: every data-plane and business binary imports it, so a
# vulnerable dependency here reaches all of them.
name: Vuln scan

on:
  schedule:
    # Tuesdays and Fridays 03:30 UTC — ahead of the consumers (04:00+) so a
    # finding here is visible before the repos that vendor it report. Both days
    # track Renovate's Tue+Fri wave; the 30-minute lead is what orders them.
    - cron: "30 3 * * 2,5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    uses: lightwebinc/ci/.github/workflows/govulncheck.yml@7f9020d8d83ebd09b9a9581aa0ee6cc2f78708e0 # v0.5.1
