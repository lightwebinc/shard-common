name: CI

on:
  # main only: a branch with a PR is covered by the pull_request run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # freebsd is a real deployment target and this module carries GOOS-split
  # files (netjoin sockaddr_linux.go / sockaddr_bsd.go) that only a freebsd
  # build compiles. A linux runner can build and vet it, not run its tests.
  go:
    uses: lightwebinc/ci/.github/workflows/go-host.yml@192a5b5169fd635e191104c14631525bbcd5ec60 # v0.3.0
    with:
      goos: '["linux", "freebsd"]'
      tidy-check: true
      golangci-lint-version: v2.14.0

  govulncheck:
    uses: lightwebinc/ci/.github/workflows/govulncheck.yml@192a5b5169fd635e191104c14631525bbcd5ec60 # v0.3.0
