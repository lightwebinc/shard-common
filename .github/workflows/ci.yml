name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # freebsd/amd64 is a real deployment target (the FreeBSD spines), and this
  # module is where the GOOS split actually lives: netjoin/sockaddr_bsd.go vs
  # netjoin/sockaddr_linux.go, hostinfo/platform_other.go vs
  # hostinfo/platform_linux.go. Until this matrix existed nothing in CI ever
  # compiled the BSD half, and it rotted unnoticed — the netjoin sockaddr layout
  # bug was found by hand on a live node, not here.
  #
  # A linux runner can only BUILD and VET the freebsd target, never run its
  # tests, so the freebsd entry is honestly a compile+type-check job. That is
  # still the whole failure class that was escaping.
  build:
    name: build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, freebsd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"

      # `go mod tidy` resolves imports across every build configuration, so its
      # result does not depend on GOOS. Run it once.
      - name: go mod tidy check
        if: matrix.goos == 'linux'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build -buildvcs=false ./...

      # `go build ./...` never compiles _test.go, so a platform-gated test that
      # references a linux-only symbol still slips through. go vet type-checks
      # the test files as well. Only the cross target is vetted here; the linux
      # vet already runs in the lint job next to golangci-lint.
      - name: Vet
        if: matrix.goos != 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go vet ./...

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"

      - name: govulncheck
        # PINNED like the Dagger repos: govulncheck >=v1.2 panics on Go 1.26
        # ("ForEachElement called on type containing *types.TypeParam") on some
        # code shapes, and @latest floats into it without a commit here. The vuln
        # DATABASE is fetched at run time, so the pin costs no detection freshness.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"

      - name: Unit tests
        run: go test -race ./...
